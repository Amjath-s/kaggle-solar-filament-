# V12 — ResNet18 U-Net @256 on YOLO11s-seg@1024 proposal crops (friend V17 stack)
seed: 42

experiment: v12
hypothesis: >
  All-annotator YOLO11s-seg@1024 + consensus TTA + ResNet18@256 clamped to
  7x7-dilated YOLO seed recovers friend's V17 frontier (~0.39 public / ~0.45 local).

data:
  images_dir: data/raw/MAGFiLO_1.0_Kaggle_2026/train/train_images
  annotations: data/raw/MAGFiLO_1.0_Kaggle_2026/train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  splits_dir: data/splits
  crop_root: experiments/v12/crops

yolo:
  weights: experiments/v12/yolo11s/weights/best.pt
  conf: 0.30
  iou: 0.7
  imgsz: 1024

overlap:
  hard_neg_max_iou: 0.05
  hard_neg_max_inter_box: 0.02
  positive_min_iou: 0.30
  positive_min_inter_gt: 0.50
  hard_neg_cap_vs_pos: 1.5

image_size: 256
pad_frac: 0.20
batch_size: 8
num_workers: 0
epochs: 40
patience: 12
learning_rate: 0.0001
optimizer: adamw
weight_decay: 0.0001
loss: bce_dice
bce_weight: 0.5
dice_weight: 0.5
threshold: 0.45
amp: true
num_classes: 1

augmentation:
  hflip: true
  vflip: true
  rotate_deg: 0
  translate_frac: 0.0
  scale_range: [1.0, 1.0]
  p: 0.5

model:
  name: resnet18_unet
  in_channels: 1
  pretrained: true

infer:
  yolo_weights: experiments/v12/yolo11s/weights/best.pt
  yolo_conf: 0.30
  yolo_iou: 0.7
  yolo_imgsz: 1024
  local_checkpoint: experiments/v12/resnet18_refiner/best.pt
  pad_frac: 0.20
  threshold: 0.45
  min_area: 20
  seed_dilate: 7
  match_iou: 0.5
  nms_iou: 0.5
  use_consensus: true
  use_orphans: false
  out_size: 2048

gates:
  v7_pq_ref: 0.379
  milestone_pq: 0.42
  submit_ready_pq: 0.45

output:
  checkpoint_dir: experiments/v12/resnet18_refiner
  dir: experiments/v12
